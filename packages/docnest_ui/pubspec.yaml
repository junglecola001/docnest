name: docnest_ui
description: DocNest's shared Prism-based UI layer - theme, localizations, app shell and async scaffolding.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.10.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  prism_ui: 0.1.2
  docnest_core:
    path: ../docnest_core

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
