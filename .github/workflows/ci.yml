name: DocNest

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.9

jobs:
  check:
    name: Format, analyze, import rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format
        # Generated code is committed exactly as the generator emits it, so it is
        # excluded here; a formatting pass would make the codegen check fail.
        run: |
          files=$(git ls-files '*.dart' | grep -vE '\.(g|freezed)\.dart$')
          dart format --output=none --set-exit-if-changed $files
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Import rules
        run: dart run tools/bin/check_imports.dart

  codegen:
    name: Generated code is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # l10n and riverpod output are committed; regenerate and fail on drift.
      - run: flutter gen-l10n
        working-directory: apps/docnest
      - run: dart run build_runner build --delete-conflicting-outputs
        working-directory: apps/docnest
      - run: git diff --exit-code

  test-dart:
    name: Pure Dart tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: docnest_core
        run: dart test packages/docnest_core
      - name: docnest_protocol
        run: dart test packages/docnest_protocol
      - name: docnest_host
        run: dart test packages/docnest_host

  test-flutter:
    name: Flutter widget tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test packages/docnest_ui
      - run: flutter test apps/docnest

  build-windows:
    name: Build Windows
    # Heavy native build: runs on main, tags and manual dispatch, never on PRs.
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
        working-directory: apps/docnest
      - uses: actions/upload-artifact@v4
        with:
          name: docnest-windows-release
          path: apps/docnest/build/windows/x64/runner/Release/
          if-no-files-found: error

  build-android:
    name: Build Android
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
        working-directory: apps/docnest
      - uses: actions/upload-artifact@v4
        with:
          name: docnest-android-apk
          path: apps/docnest/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build-windows, build-android]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/docnest-windows-release/**
            dist/docnest-android-apk/*.apk
          generate_release_notes: true
